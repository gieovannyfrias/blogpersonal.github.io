<style>
      :root {

* {

}

body {

  /* ==========================================================================
   11. PÁGINA DE ERROR O CONTENIDO NO DISPONIBLE (NO_DISPONIBLE.HTML)
   ========================================================================== */
.error-main-container {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8rem 2rem 4rem 2rem;
    text-align: center;
}

.error-content-box {
    max-width: 580px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.error-icon-visual {
    font-size: 3.5rem;
    color: var(--accent-gold);
    background-color: rgba(212, 175, 55, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.1);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2rem;
    animation: rotateHourglass 4s infinite ease-in-out;
}

.error-content-box h1 {
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.5px;
    margin-bottom: 1.25rem;
}

.error-content-box p {
    color: var(--text-secondary);
    font-size: 1.05rem;
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 3rem;
}

.error-actions-layout {
    display: flex;
    gap: 1.5rem;
}

/* Animación sutil para el icono de reloj de arena corporativo */
@keyframes rotateHourglass {
    0%, 100% {
        transform: rotate(0deg);
    }
    45%, 55% {
        transform: rotate(180deg);
    }
}

/* Ajuste responsive para los botones de acción */
@media (max-width: 576px) {
    .error-actions-layout {
        flex-direction: column;
        width: 100%;
        gap: 1rem;
    }
    .error-actions-layout .btn-primary,
    .error-actions-layout .btn-secondary {
        width: 100%;
        justify-content: center;
    }
}
